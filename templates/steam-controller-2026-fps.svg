      <text x="2110" y="179" class="mod" style="white-space: pre;">M1 <tspan fill="#111827" data-bind="modes.fps.modifiers.l4.controls.rb.regular.action">Throwables radial</tspan></text>
    </g>
    <g id="fps-rt-label">
      <text x="1637" y="135" class="label" text-anchor="middle" style="white-space: pre;">RT</text>
      <text x="1637" y="161" class="body" text-anchor="middle" data-bind="modes.fps.controls.rt.regular.action" style="white-space: pre;">Fire / Use</text>
    </g>
    <g id="fps-x-label">
      <text x="2110" y="252" class="label" style="white-space: pre;">X</text>
      <text x="2110" y="278" class="body" data-bind="modes.fps.controls.x.regular.action" style="white-space: pre;">Reload / Holster</text>
      <text x="2110" y="304" class="mod" style="white-space: pre;">M1 <tspan fill="#111827" data-bind="modes.fps.modifiers.l4.controls.x.regular.action">Ammo backpack refill</tspan></text>
    </g>
    <g id="fps-y-label">
      <text x="2110" y="414" class="label" style="white-space: pre;">Y</text>
      <text x="2110" y="440" class="body" data-bind="modes.fps.controls.y.regular.action" style="white-space: pre;">Interact</text>
      <text x="2110" y="466" class="meta" style="white-space: pre;">[2] <tspan data-bind="modes.fps.controls.y.double_press.action">Hold interaction</tspan></text>
    </g>
    <g id="fps-b-label">
      <text x="2110" y="606" class="label" style="white-space: pre;">B</text>
      <text x="2110" y="632" class="body" data-bind="modes.fps.controls.b.regular.action" style="white-space: pre;">Crouch</text>
      <text x="2110" y="658" class="meta" style="white-space: pre;">[H] <tspan data-bind="modes.fps.controls.b.long_press.action">Prone</tspan></text>
    </g>
    <g id="fps-a-label">
      <text x="2110" y="811" class="label" style="white-space: pre;">A</text>
      <text x="2110" y="837" class="body" data-bind="modes.fps.controls.a.regular.action" style="white-space: pre;">Jump</text>
      <text x="2110" y="863" class="mod" style="white-space: pre;">M1 <tspan fill="#111827" data-bind="modes.fps.modifiers.l4.controls.a.regular.action">Key B</tspan></text>
    </g>
    <g id="fps-right-stick-label">
      <text x="2130" y="984" class="label" style="white-space: pre;">RIGHT STICK / R3</text>
      <text x="2130" y="1010" class="body" data-bind="modes.fps.controls.right_stick.action" style="white-space: pre;">Aim / Look</text>
      <text x="2130" y="1036" class="meta" style="white-space: pre;">Touch: Gyro To Mouse (<tspan data-bind="modes.fps.gyro.action">Precision aim</tspan>)</text>
      <text x="2130" y="1062" class="meta" style="white-space: pre;">[2] Touch: <tspan data-bind="modes.fps.controls.right_stick_touch.double_press.action">Flashlight</tspan></text>
      <text x="2130" y="1088" class="meta" style="white-space: pre;">R3: <tspan data-bind="modes.fps.controls.r3.regular.action">Melee</tspan></text>
      <text x="2130" y="1114" class="meta" style="white-space: pre;">[2] R3: <tspan data-bind="modes.fps.controls.r3.double_press.action">Fire mode toggle</tspan></text>
      <text x="2130" y="1140" class="mod" style="white-space: pre;">M1 R3: <tspan fill="#111827" data-bind="modes.fps.modifiers.l4.controls.r3.regular.action">Customize weapon</tspan></text>
      <text x="2130" y="1166" class="mod" style="white-space: pre;">M1 [H] R3: <tspan fill="#111827" data-bind="modes.fps.modifiers.l4.controls.r3.long_press.action">Inspect item / weapon</tspan></text>
    </g>
    <g id="fps-right-trackpad-label">
      <text x="2140" y="1224" class="label" style="white-space: pre;">RIGHT TRACKPAD</text>
      <text x="2140" y="1250" class="body" style="white-space: pre;">↑ <tspan data-bind="modes.fps.controls.right_trackpad.up.action">Scroll up</tspan></text>
      <text x="2140" y="1276" class="body" style="white-space: pre;">↓ <tspan data-bind="modes.fps.controls.right_trackpad.down.action">Scroll down</tspan></text>
    </g>
