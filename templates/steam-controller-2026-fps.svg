<?xml version="1.0" encoding="utf-8"?>
<svg width="2560" height="1440" viewBox="0 0 2560 1440" version="1.1" id="svg49" xmlns="http://www.w3.org/2000/svg">
  <defs id="defs1">
    <style id="style1">
      .bg{fill:#f3f4f6}
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:42px;font-weight:800;fill:#111827;letter-spacing:.4px}
      .subtitle{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;font-weight:500;fill:#4b5563}
      .mode{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:24px;font-weight:800;fill:#0f766e;letter-spacing:1px}
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:22px;font-weight:700;fill:#111827}
      .body{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:21px;font-weight:600;fill:#111827}
      .meta{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:19px;font-weight:600;fill:#374151}
      .mod{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:19px;font-weight:700;fill:#c56a00}
      .legend{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:600;fill:#374151}
      .legendKey{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:800;fill:#111827}
      .legendMod{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:800;fill:#c56a00}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:600;fill:#4b5563}
    </style>
  </defs>

  <g id="layer-background"/>

  <g id="layer-header">
    <text x="70" y="72" class="title">STAR CITIZEN · STEAM CONTROLLER 2026</text>
    <text x="70" y="108" class="subtitle">Player quick-reference · FPS Mode · complete Steam Input mapping</text>
    <text x="2390" y="72" class="mode" text-anchor="end" id="mode_name">FPS MODE</text>
  </g>

  <g id="layer-controller">
    <image id="controller-front" x="525.41364" y="282.6506" width="1455.3413" height="905.91565" preserveAspectRatio="xMidYMid" href="assets/steam-controller-2026.png"/>
  </g>

  <!-- User-arranged leader lines: preserved exactly -->
  <g id="layer-leaders">
    <path style="fill:none;stroke:rgb(0,76,237);stroke-width:3px" d="M 1746.147 512.861 L 1968.455 626.794 L 2094.892 629.573"/>
