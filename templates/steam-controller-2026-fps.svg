  <g id="layer-labels" transform="matrix(1, 0, 0, 1, 0, 37.000013)">
    <g id="fps-lb-label">
      <text x="430" y="145" class="label" text-anchor="end" style="white-space: pre;">LB</text>
      <text x="430" y="171" class="body" text-anchor="end" data-bind="modes.fps.controls.lb.regular.action" style="white-space: pre;">Lean left</text>
      <text x="430" y="197" class="mod" text-anchor="end" style="white-space: pre;">M1 <tspan fill="#111827" data-bind="modes.fps.modifiers.l4.controls.lb.regular.action">Consumable / healing wheel</tspan></text>
    </g>
    <g id="fps-lt-label">
      <text x="835" y="145" class="label" text-anchor="middle" style="white-space: pre;">LT</text>
      <text x="835" y="171" class="body" text-anchor="middle" data-bind="modes.fps.controls.lt.regular.action" style="white-space: pre;">ADS</text>
    </g>
    <g id="fps-back-label">
      <text x="1028" y="191" class="label" text-anchor="middle" style="white-space: pre;">BACK</text>
      <text x="1028" y="214" class="body" text-anchor="middle" data-bind="global.back.regular.action" style="white-space: pre;">mobiGlas</text>
      <text x="1028" y="237" class="meta" text-anchor="middle" style="white-space: pre;">[H] <tspan data-bind="global.back.long_press.action">Map</tspan></text>
      <text x="1028" y="260" class="mod" text-anchor="middle" style="white-space: pre;">M1 <tspan fill="#111827" data-bind="modes.fps.modifiers.l4.controls.back.regular.action">Accept invite</tspan></text>
    </g>
    <g id="fps-dpad-right-label">
      <text x="424" y="266" class="label" text-anchor="end" style="white-space: pre;">D-PAD →</text>
      <text x="424" y="292" class="body" text-anchor="end" data-bind="modes.fps.controls.dpad_right.regular.action" style="white-space: pre;">Inventory</text>
    </g>
    <g id="fps-dpad-up-label">
      <text x="440" y="420" class="label" text-anchor="end" style="white-space: pre;">D-PAD ↑</text>
      <text x="440" y="446" class="mod" text-anchor="end" style="white-space: pre;">M1 <tspan fill="#111827" data-bind="modes.fps.modifiers.l4.controls.dpad_up.regular.action">Camera view</tspan></text>
    </g>
    <g id="fps-dpad-left-label">
      <text x="430" y="584" class="label" text-anchor="end" style="white-space: pre;">D-PAD ←</text>
      <text x="430" y="610" class="mod" text-anchor="end" style="white-space: pre;">M1 <tspan fill="#111827" data-bind="modes.fps.modifiers.l4.controls.dpad_left.regular.action">Toggle chat</tspan></text>
    </g>
    <g id="fps-dpad-down-label">
      <text x="430" y="722" class="label" text-anchor="end" style="white-space: pre;">D-PAD ↓</text>
      <text x="430" y="748" class="mod" text-anchor="end" style="white-space: pre;">M1 <tspan fill="#111827" data-bind="modes.fps.modifiers.l4.controls.dpad_down.regular.action">Helmet on/off</tspan></text>
    </g>
    <g id="fps-left-stick-label">
      <text x="430" y="915" class="label" text-anchor="end" style="white-space: pre;">LEFT STICK</text>
      <text x="430" y="941" class="body" text-anchor="end" data-bind="modes.fps.controls.left_stick.action" style="white-space: pre;">Move</text>
      <text x="430" y="967" class="meta" text-anchor="end" style="white-space: pre;">L3: <tspan data-bind="modes.fps.controls.l3.regular.action">Sprint toggle</tspan></text>
    </g>
    <g id="fps-left-trackpad-label">
      <text x="398" y="1238" class="label" text-anchor="end" style="white-space: pre;">LEFT TRACKPAD</text>
      <text x="398" y="1264" class="meta" text-anchor="end" data-bind="modes.fps.controls.left_trackpad.action" style="white-space: pre;">Unassigned</text>
    </g>
    <g id="fps-start-label">
      <text x="1479" y="190" class="label" text-anchor="middle" style="white-space: pre;">START</text>
      <text x="1479" y="214" class="body" text-anchor="middle" data-bind="global.start.regular.action" style="white-space: pre;">Menu</text>
      <text x="1479" y="238" class="mod" text-anchor="middle" style="white-space: pre;">M1 <tspan fill="#111827" data-bind="modes.fps.modifiers.l4.controls.start.regular.action">Decline invite</tspan></text>
    </g>
    <g id="fps-rb-label">
      <text x="2110" y="127" class="label" style="white-space: pre;">RB</text>
