  </g>

  <g id="layer-labels">
    <!-- Left side -->
    <g id="fps-lb-label">
      <text x="430" y="145" class="label" text-anchor="end">LB</text>
      <text x="430" y="171" class="body" text-anchor="end" data-bind="modes.fps.controls.lb.regular.action">Lean left</text>
      <text x="430" y="197" class="mod" text-anchor="end">M1 <tspan fill="#111827" data-bind="modes.fps.modifiers.l4.controls.lb.regular.action">Unassigned</tspan></text>
    </g>

    <g id="fps-lt-label">
      <text x="835" y="145" class="label" text-anchor="middle">LT</text>
      <text x="835" y="171" class="body" text-anchor="middle" data-bind="modes.fps.controls.lt.regular.action">ADS</text>
    </g>

    <g id="fps-back-label">
      <text x="1028" y="191" class="label" text-anchor="middle">BACK</text>
      <text x="1028" y="214" class="body" text-anchor="middle" data-bind="global.back.regular.action">mobiGlas</text>
      <text x="1028" y="237" class="meta" text-anchor="middle">[H] <tspan data-bind="global.back.long_press.action">Map</tspan></text>
      <text x="1028" y="260" class="mod" text-anchor="middle">M1 <tspan fill="#111827" data-bind="modes.fps.modifiers.l4.controls.back.regular.action">Accept invite</tspan></text>
    </g>

    <g id="fps-dpad-right-label">
      <text x="424" y="266" class="label" text-anchor="end">D-PAD →</text>
      <text x="424" y="292" class="body" text-anchor="end" data-bind="modes.fps.controls.dpad_right.regular.action">Inventory</text>
    </g>

    <g id="fps-dpad-up-label">
      <text x="440" y="420" class="label" text-anchor="end">D-PAD ↑</text>
      <text x="440" y="446" class="mod" text-anchor="end">M1 <tspan fill="#111827" data-bind="modes.fps.modifiers.l4.controls.dpad_up.regular.action">Camera view</tspan></text>
    </g>

    <g id="fps-dpad-left-label">
      <text x="430" y="584" class="label" text-anchor="end">D-PAD ←</text>
      <text x="430" y="610" class="meta" text-anchor="end">Unassigned</text>
    </g>

    <g id="fps-dpad-down-label">
      <text x="430" y="722" class="label" text-anchor="end">D-PAD ↓</text>
      <text x="430" y="748" class="mod" text-anchor="end">M1 <tspan fill="#111827" data-bind="modes.fps.modifiers.l4.controls.dpad_down.regular.action">Helmet on/off</tspan></text>
    </g>

    <g id="fps-left-stick-label">
      <text x="430" y="915" class="label" text-anchor="end">LEFT STICK</text>
      <text x="430" y="941" class="body" text-anchor="end" data-bind="modes.fps.controls.left_stick.action">Move</text>
      <text x="430" y="967" class="meta" text-anchor="end">L3: <tspan data-bind="modes.fps.controls.l3.regular.action">Sprint toggle</tspan></text>
    </g>

    <g id="fps-left-trackpad-label">
      <text x="398" y="1238" class="label" text-anchor="end">LEFT TRACKPAD</text>
      <text x="398" y="1264" class="meta" text-anchor="end" data-bind="modes.fps.controls.left_trackpad.action">Unassigned</text>
    </g>

    <!-- Top / center -->
    <g id="fps-steam-label">
      <text x="1253" y="118" class="label" text-anchor="middle">STEAM</text>
      <text x="1253" y="143" class="meta" text-anchor="middle">Unassigned</text>
    </g>

    <g id="fps-start-label">
      <text x="1479" y="190" class="label" text-anchor="middle">START</text>
      <text x="1479" y="214" class="body" text-anchor="middle" data-bind="global.start.regular.action">Menu</text>
      <text x="1479" y="238" class="mod" text-anchor="middle">M1 <tspan fill="#111827" data-bind="modes.fps.modifiers.l4.controls.start.regular.action">Decline invite</tspan></text>
    </g>

    <g id="fps-ellipsis-label">
      <text x="1249" y="1128" class="label" text-anchor="middle">… BUTTON</text>
      <text x="1249" y="1154" class="meta" text-anchor="middle">Unassigned</text>
    </g>

    <!-- Right side -->
    <g id="fps-rb-label">
      <text x="2110" y="127" class="label">RB</text>
      <text x="2110" y="153" class="body" data-bind="modes.fps.controls.rb.regular.action">Lean right</text>
      <text x="2110" y="179" class="mod">M1 <tspan fill="#111827" data-bind="modes.fps.modifiers.l4.controls.rb.regular.action">Throwables radial</tspan></text>
    </g>

    <g id="fps-rt-label">
      <text x="1637" y="135" class="label" text-anchor="middle">RT</text>
      <text x="1637" y="161" class="body" text-anchor="middle" data-bind="modes.fps.controls.rt.regular.action">Fire / Use</text>
    </g>

    <g id="fps-x-label">
      <text x="2110" y="252" class="label">X</text>
      <text x="2110" y="278" class="body" data-bind="modes.fps.controls.x.regular.action">Reload / Holster</text>
      <text x="2110" y="304" class="mod">M1 <tspan fill="#111827" data-bind="modes.fps.modifiers.l4.controls.x.regular.action">Ammo backpack refill</tspan></text>
    </g>

    <g id="fps-y-label">
      <text x="2110" y="414" class="label">Y</text>
      <text x="2110" y="440" class="body" data-bind="modes.fps.controls.y.regular.action">Interact</text>
      <text x="2110" y="466" class="meta">[2] <tspan data-bind="modes.fps.controls.y.double_press.action">Hold interaction</tspan></text>
    </g>

    <g id="fps-b-label">
      <text x="2110" y="606" class="label">B</text>
      <text x="2110" y="632" class="body" data-bind="modes.fps.controls.b.regular.action">Crouch</text>
      <text x="2110" y="658" class="meta">[H] <tspan data-bind="modes.fps.controls.b.long_press.action">Prone</tspan></text>
      <text x="2110" y="684" class="mod">M1 <tspan fill="#111827" data-bind="modes.fps.modifiers.l4.controls.b.regular.action">Unassigned</tspan></text>
    </g>

    <g id="fps-a-label">
      <text x="2110" y="811" class="label">A</text>
      <text x="2110" y="837" class="body" data-bind="modes.fps.controls.a.regular.action">Jump</text>
      <text x="2110" y="863" class="mod">M1 <tspan fill="#111827" data-bind="modes.fps.modifiers.l4.controls.a.regular.action">Key B</tspan></text>
    </g>

    <g id="fps-right-stick-label">
      <text x="2130" y="984" class="label">RIGHT STICK / R3</text>
      <text x="2130" y="1010" class="body" data-bind="modes.fps.controls.right_stick.action">Aim / Look</text>
      <text x="2130" y="1036" class="meta">Touch: Gyro To Mouse (<tspan data-bind="modes.fps.gyro.action">Precision aim</tspan>)</text>
      <text x="2130" y="1062" class="meta">[2] Touch: <tspan data-bind="modes.fps.controls.right_stick_touch.double_press.action">Flashlight</tspan></text>
      <text x="2130" y="1088" class="meta">R3: <tspan data-bind="modes.fps.controls.r3.regular.action">Melee</tspan></text>
      <text x="2130" y="1114" class="mod">M1 R3: <tspan fill="#111827" data-bind="modes.fps.modifiers.l4.controls.r3.regular.action">Next weapon</tspan></text>
    </g>

    <g id="fps-right-trackpad-label">
      <text x="2140" y="1224" class="label">RIGHT TRACKPAD</text>
      <text x="2140" y="1250" class="body">↑ <tspan data-bind="modes.fps.controls.right_trackpad.up.action">Scroll up</tspan></text>
      <text x="2140" y="1276" class="body">↓ <tspan data-bind="modes.fps.controls.right_trackpad.down.action">Scroll down</tspan></text>
    </g>
  </g>

  <!-- Rear/global controls have no visible front-face anchor -->
  <g id="fps-rear-global" transform="translate(620 1220)">
    <text x="0" y="0" class="label">REAR / GLOBAL</text>
    <text x="0" y="28" class="mod">L4: <tspan fill="#111827" data-bind="global.l4.regular.action">Hold L4 Modifier layer</tspan></text>
    <text x="0" y="54" class="body">Left rear lower: <tspan data-bind="modes.fps.controls.left_rear_lower.regular.action">Key 1</tspan></text>
    <text x="0" y="80" class="meta">RG [H]: <tspan data-bind="global.rg.long_press.action">Switch FPS / Flight mode</tspan></text>
  </g>

  <g id="fps-legend">
    <text x="950" y="1340" class="legend"><tspan class="legendKey">[H]</tspan> Hold</text>
    <text x="1090" y="1340" class="legend"><tspan class="legendKey">[2]</tspan> Double Press</text>
    <text x="1275" y="1340" class="legend"><tspan class="legendMod">M1</tspan> L4 Modifier</text>
  </g>
</svg>
