<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset="1" stop-color="#111922"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="controllerClip"><rect x="550" y="145" width="1460" height="870" rx="28"/></clipPath>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:42px;font-weight:700;fill:#f4f7fa;letter-spacing:.8px}.subtitle{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:21px;font-weight:500;fill:#8fa5b8}.mode{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:24px;font-weight:700;fill:#86d7ff;letter-spacing:1px}.box{fill:#111a24;stroke:#2a3b4a;stroke-width:2}.boxAccent{fill:#111a24;stroke:#47c8ff;stroke-width:2}.boxModifier{fill:#171320;stroke:#a778ff;stroke-width:2}.button{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:27px;font-weight:800;fill:#fff}.action{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:23px;font-weight:600;fill:#e6edf3}.secondary{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:19px;font-weight:500;fill:#9fb0bf}.legend{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:17px;font-weight:500;fill:#9fb0bf}.leader{fill:none;stroke:#47c8ff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.leaderDim{fill:none;stroke:#647889;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#47c8ff}.section{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:800;fill:#86d7ff;letter-spacing:1.4px}.smallcap{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:15px;font-weight:700;fill:#7f93a5;letter-spacing:1px}
    </style>
  </defs>
  <rect width="2560" height="1440" fill="url(#bg)"/>
  <text x="64" y="70" class="title">STAR CITIZEN · STEAM CONTROLLER 2026</text>
  <text x="64" y="108" class="subtitle">Player quick-reference · controller actions only</text>
  <rect x="2170" y="42" width="326" height="74" rx="16" class="boxAccent"/>
  <text id="mode_name" x="2333" y="88" text-anchor="middle" class="mode">FPS MODE</text>

  <rect x="550" y="145" width="1460" height="870" rx="28" fill="#d9d9d5" stroke="#2a3b4a" stroke-width="2" filter="url(#shadow)"/>
  <g clip-path="url(#controllerClip)"><image x="325" y="-46" width="1913" height="1256" preserveAspectRatio="none" href="steam-controller-2026.webp"/></g>

  <g id="fps_lt_box"><rect x="54" y="164" width="430" height="102" rx="16" class="boxAccent"/><text x="78" y="201" class="button">LT</text><text x="150" y="201" class="action" data-bind="modes.fps.controls.lt.regular.action">ADS</text><text x="78" y="236" class="secondary">Aim down sights</text><path d="M484 214 L570 214 L875 308" class="leader"/><circle cx="875" cy="308" r="6" class="dot"/></g>
  <g id="fps_lb_box"><rect x="54" y="286" width="430" height="102" rx="16" class="box"/><text x="78" y="323" class="button">LB</text><text x="150" y="323" class="action" data-bind="modes.fps.controls.lb.regular.action">Lean left</text><text x="78" y="358" class="secondary">Hold while leaning</text><path d="M484 336 L570 336 L850 355" class="leaderDim"/></g>
  <g id="fps_left_stick_box"><rect x="54" y="418" width="430" height="118" rx="16" class="boxAccent"/><text x="78" y="457" class="button">LEFT STICK</text><text x="78" y="494" class="action" data-bind="modes.fps.controls.left_stick.action">Move</text><text x="78" y="521" class="secondary">Forward · back · strafe</text><path d="M484 476 L560 476 L1020 484" class="leader"/><circle cx="1020" cy="484" r="6" class="dot"/></g>
  <g id="fps_l3_box"><rect x="54" y="556" width="430" height="102" rx="16" class="box"/><text x="78" y="593" class="button">L3</text><text x="150" y="593" class="action" data-bind="modes.fps.controls.l3.regular.action">Sprint toggle</text><text x="78" y="628" class="secondary">Click left stick</text><path d="M484 607 L560 607 L1020 484" class="leaderDim"/></g>
  <g id="fps_dpad_box"><rect x="54" y="688" width="430" height="128" rx="16" class="box"/><text x="78" y="726" class="button">D-PAD RIGHT</text><text x="78" y="764" class="action" data-bind="modes.fps.controls.dpad_right.regular.action">Inventory</text><text x="78" y="793" class="secondary">Hold: inventory view</text><path d="M484 752 L570 752 L780 390" class="leaderDim"/></g>

  <g id="fps_rt_box"><rect x="2076" y="164" width="430" height="102" rx="16" class="boxAccent"/><text x="2100" y="201" class="button">RT</text><text x="2172" y="201" class="action" data-bind="modes.fps.controls.rt.regular.action">Fire / Use</text><text x="2100" y="236" class="secondary">Primary item action</text><path d="M2076 214 L1990 214 L1692 308" class="leader"/><circle cx="1692" cy="308" r="6" class="dot"/></g>
  <g id="fps_rb_box"><rect x="2076" y="286" width="430" height="102" rx="16" class="box"/><text x="2100" y="323" class="button">RB</text><text x="2172" y="323" class="action" data-bind="modes.fps.controls.rb.regular.action">Lean right</text><text x="2100" y="358" class="secondary">Hold while leaning</text><path d="M2076 336 L1990 336 L1715 355" class="leaderDim"/></g>
  <g id="fps_face_buttons_box"><rect x="2076" y="418" width="430" height="294" rx="16" class="boxAccent"/><text x="2100" y="454" class="section">FACE BUTTONS</text><text x="2100" y="496" class="button">A</text><text x="2160" y="496" class="action" data-bind="modes.fps.controls.a.regular.action">Jump</text><text x="2100" y="540" class="button">B</text><text x="2160" y="540" class="action" data-bind="modes.fps.controls.b.regular.action">Crouch</text><text x="2160" y="570" class="secondary">Long Press: <tspan data-bind="modes.fps.controls.b.long_press.action">Prone</tspan></text><text x="2100" y="614" class="button">X</text><text x="2160" y="614" class="action" data-bind="modes.fps.controls.x.regular.action">Reload / Holster</text><text x="2100" y="658" class="button">Y</text><text x="2160" y="658" class="action" data-bind="modes.fps.controls.y.regular.action">Interact</text><text x="2160" y="688" class="secondary">Double Press: <tspan data-bind="modes.fps.controls.y.double_press.action">Hold interaction</tspan></text><path d="M2076 564 L1998 564 L1825 444" class="leader"/></g>
  <g id="fps_right_stick_box"><rect x="2076" y="736" width="430" height="240" rx="16" class="boxAccent"/><text x="2100" y="773" class="button">RIGHT STICK / R3</text><text x="2100" y="812" class="action" data-bind="modes.fps.controls.right_stick.action">Aim / Look</text><text x="2100" y="844" class="secondary">Touch: <tspan data-bind="modes.fps.controls.right_stick_touch.regular.action">Precision aim</tspan></text><text x="2100" y="874" class="secondary">Double Touch: <tspan data-bind="modes.fps.controls.right_stick_touch.double_press.action">Flashlight</tspan></text><text x="2100" y="914" class="secondary">R3: <tspan data-bind="modes.fps.controls.r3.regular.action">Melee</tspan></text><text x="2100" y="944" class="secondary">R3 Double: <tspan data-bind="modes.fps.controls.r3.double_press.action">Fire mode toggle</tspan></text><path d="M2076 842 L1995 842 L1530 484" class="leader"/></g>

  <g id="fps_back_box"><rect x="830" y="114" width="330" height="104" rx="16" class="box"/><text x="854" y="151" class="button">BACK</text><text x="944" y="151" class="action" data-bind="global.back.regular.action">mobiGlas</text><text x="854" y="187" class="secondary">Long Press: <tspan data-bind="global.back.long_press.action">Map</tspan></text><path d="M995 218 L995 273" class="leaderDim"/></g>
  <g id="fps_start_box"><rect x="1400" y="114" width="330" height="104" rx="16" class="box"/><text x="1424" y="151" class="button">START</text><text x="1516" y="151" class="action" data-bind="global.start.regular.action">Menu</text><path d="M1565 218 L1565 273" class="leaderDim"/></g>
  <rect x="640" y="936" width="376" height="60" rx="14" class="box"/><text x="828" y="974" text-anchor="middle" class="secondary">LEFT TRACKPAD · unassigned</text><rect x="1544" y="936" width="376" height="60" rx="14" class="box"/><text x="1732" y="974" text-anchor="middle" class="secondary">RIGHT TRACKPAD · unassigned</text>

  <g id="fps_l4_panel"><rect x="54" y="1040" width="1800" height="314" rx="22" class="boxModifier"/><text x="84" y="1083" class="section">L4 MODIFIER · HOLD L4</text><text x="84" y="1112" class="secondary">Modifier actions override or add to the base FPS controls.</text><text x="92" y="1162" class="button">L4 + X</text><text x="250" y="1162" class="action" data-bind="modes.fps.modifiers.l4.controls.x.regular.action">Ammo backpack refill</text><text x="92" y="1206" class="button">L4 + B</text><text x="250" y="1206" class="action" data-bind="modes.fps.modifiers.l4.controls.b.regular.action">Healing / Weapon wheel</text><text x="92" y="1250" class="button">L4 + RB</text><text x="250" y="1250" class="action" data-bind="modes.fps.modifiers.l4.controls.rb.regular.action">Throwables radial</text><text x="710" y="1162" class="button">L4 + R3</text><text x="884" y="1162" class="action" data-bind="modes.fps.modifiers.l4.controls.r3.regular.action">Next weapon</text><text x="884" y="1193" class="secondary">Long Press: <tspan data-bind="modes.fps.modifiers.l4.controls.r3.long_press.action">Inspect weapon</tspan></text><text x="710" y="1248" class="button">L4 + D-PAD ↑</text><text x="948" y="1248" class="action" data-bind="modes.fps.modifiers.l4.controls.dpad_up.regular.action">Camera view</text><text x="710" y="1292" class="button">L4 + D-PAD ↓</text><text x="948" y="1292" class="action" data-bind="modes.fps.modifiers.l4.controls.dpad_down.regular.action">Helmet on/off</text><text x="1322" y="1162" class="button">L4 + BACK</text><text x="1536" y="1162" class="action" data-bind="modes.fps.modifiers.l4.controls.back.regular.action">Accept invite</text><text x="1322" y="1206" class="button">L4 + START</text><text x="1536" y="1206" class="action" data-bind="modes.fps.modifiers.l4.controls.start.regular.action">Decline invite</text></g>

  <g id="global_panel"><rect x="1882" y="1040" width="624" height="314" rx="22" class="box"/><text x="1912" y="1083" class="section">GLOBAL / MODE</text><text x="1912" y="1140" class="button">RG</text><text x="1994" y="1140" class="action">Double Press</text><text x="1912" y="1173" class="secondary" data-bind="global.rg.double_press.action">Switch FPS / Flight mode</text><line x1="1912" y1="1206" x2="2474" y2="1206" stroke="#263746" stroke-width="2"/><text x="1912" y="1248" class="smallcap">ACTIVATOR LEGEND</text><text x="1912" y="1284" class="legend">Long Press · secondary action after hold threshold</text><text x="1912" y="1316" class="legend">Double Press · alternate action on double tap</text><text x="1912" y="1348" class="legend">L4 + · action while L4 modifier is held</text></g>
</svg>
