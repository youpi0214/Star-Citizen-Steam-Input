<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <style>
    .bg { fill: #0b0f14; }
    .panel { fill: #131a22; stroke: #2b3a4a; stroke-width: 2; }
    .title { fill: #f5f7fa; font: 700 42px sans-serif; }
    .subtitle { fill: #9fb0c1; font: 500 22px sans-serif; }
    .label { fill: #f5f7fa; font: 700 24px sans-serif; }
    .action { fill: #c7d2dc; font: 500 20px sans-serif; }
    .output { fill: #7f93a6; font: 500 16px monospace; }
  </style>

  <rect class="bg" width="1600" height="1000"/>

  <text id="title" x="80" y="90" class="title">Star Citizen — Controller Mapping</text>
  <text id="mode_name" x="80" y="130" class="subtitle" data-bind="modes.fps.name">FPS Mode</text>

  <!--
    Controller artwork goes in this group.
    Keep artwork separate from labels so the template stays easy to edit in Inkscape/Figma.
  -->
  <g id="controller-artwork">
    <rect x="500" y="270" width="600" height="430" rx="120" class="panel"/>
    <text x="800" y="490" text-anchor="middle" class="subtitle">Steam Controller 2026 artwork placeholder</text>
  </g>

  <!-- Example binding cards. Duplicate/reposition these as the final visual design evolves. -->
  <g id="binding-a" transform="translate(80 230)">
    <rect width="330" height="125" rx="14" class="panel"/>
    <text x="20" y="34" class="label">A</text>
    <text x="20" y="70" class="action" data-bind="modes.fps.controls.a.regular.action">Jump</text>
    <text x="20" y="101" class="output" data-bind="modes.fps.controls.a.regular.output">Space</text>
  </g>

  <g id="binding-x" transform="translate(80 380)">
    <rect width="330" height="125" rx="14" class="panel"/>
    <text x="20" y="34" class="label">X</text>
    <text x="20" y="70" class="action" data-bind="modes.fps.controls.x.regular.action">Reload / Holster</text>
    <text x="20" y="101" class="output" data-bind="modes.fps.controls.x.regular.output">R</text>
  </g>

  <g id="binding-rt" transform="translate(1190 230)">
    <rect width="330" height="125" rx="14" class="panel"/>
    <text x="20" y="34" class="label">RT</text>
    <text x="20" y="70" class="action" data-bind="modes.fps.controls.rt.regular.action">Fire / Use</text>
    <text x="20" y="101" class="output" data-bind="modes.fps.controls.rt.regular.output">Left Mouse</text>
  </g>

  <g id="binding-lt" transform="translate(1190 380)">
    <rect width="330" height="125" rx="14" class="panel"/>
    <text x="20" y="34" class="label">LT</text>
    <text x="20" y="70" class="action" data-bind="modes.fps.controls.lt.regular.action">ADS</text>
    <text x="20" y="101" class="output" data-bind="modes.fps.controls.lt.regular.output">Right Mouse</text>
  </g>

  <text x="80" y="930" class="subtitle">Template scaffold — controller art, callouts and final visual grammar to be refined.</text>
</svg>
