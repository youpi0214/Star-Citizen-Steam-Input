        regular:
          action: Precision aim
          output: Gyro To Mouse
          uses:
          - context: camera
            action: Precision aim
        double_press:
          action: Lights
          output: L
          uses:
          - context: camera
            action: Lights
      rt:
        regular:
          action: Forward thrust
          output: W
          uses:
          - context: vehicle_movement
            action: Forward thrust / increase throttle
          - context: ground_vehicle
            action: Drive forward
      lt:
        regular:
          action: Reverse thrust
          output: S
          uses:
          - context: vehicle_movement
            action: Reverse thrust / decrease throttle
          - context: ground_vehicle
            action: Drive backward
          - context: turret
            action: Change turret position
      left_stick_y:
        action: Strafe up / down
        output: Space / Left Ctrl
        uses:
        - context: vehicle_movement
          action: Strafe up / down
        - context: ground_vehicle
          action: Horn (stick up)
      left_stick_x:
        action: Roll left / right
        output: Q / E
        uses:
        - context: vehicle_movement
          action: Roll left / right
        - context: turret
          action: 'Left: cycle turret mouse mode; right: toggle gyro stabilization'
          note: These commands share Q/E with ship roll; they are incidental turret actions, not steering.
      rb:
        regular:
          action: Fire
          output: Left Mouse
          uses:
          - context: vehicle_combat
            action: Fire weapons
          - context: vehicle_combat
            action: Launch missiles
            input: Tap
          - context: quantum
            action: Request jump
            input: Tap
          - context: mining
            action: Fire mining laser
            input: Tap or hold
          - context: salvage
            action: Fire focused salvage tool
            input: Tap or hold
          - context: scanning
            action: Activate scanning
            input: Hold
        hold:
          action: Engage Quantum Drive
          output: Left Mouse (held)
          context: Quantum mode
          activation: Hold the regular binding; no separate Long Press activator
          uses:
          - context: quantum
            action: Engage Quantum Drive
      lb:
        regular:
          action: Precision targeting / hold max zoom
          output: Right Mouse
          uses:
          - context: vehicle_combat
            action: Toggle precision targeting
            input: Tap
          - context: vehicle_combat
            action: Maximum precision-targeting zoom
            input: Hold
          - context: salvage
            action: Cycle focused salvage modifiers
        double_press:
