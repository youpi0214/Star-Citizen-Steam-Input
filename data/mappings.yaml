              action: Inspect item / weapon
              output: O (custom Star Citizen bind)
              uses:
              - context: fps_tools
                action: Inspect item / weapon
          dpad_up:
            regular:
              action: Camera view
              output: F4
              uses:
              - context: camera
                action: Camera view
          dpad_left:
            regular:
              action: Toggle chat
              output: F12
              uses:
              - context: shared
                action: Toggle chat
          dpad_down:
            regular:
              action: Helmet on/off
              output: Left Alt + H
              uses:
              - context: fps_tools
                action: Helmet on/off
          back:
            regular:
              action: Accept invite
              output: '['
              uses:
              - context: shared
