modes:
  fps:
    name: FPS Mode
    controls:
      left_stick:
        action: Move
        output: WASD
        uses:
        - context: fps_movement
          action: Move
        - context: eva
          action: Strafe forward / backward / left / right
      l3:
        regular:
          action: Sprint toggle
          output: Left Shift
          uses:
          - context: fps_movement
            action: Sprint toggle
          - context: fps_combat
            action: Interact with scope / hold breath while ADS
            note: Left Shift is toggled by L3; press again to release it.
          - context: eva
            action: Boost
            note: L3 toggles Left Shift; press again to release.
      right_stick:
        action: Aim / Look
        output: Mouse
        uses:
        - context: fps_combat
          action: Aim / Look
        - context: eva
          action: Look / turn
      r3:
        regular:
          action: Melee
          output: Middle Mouse
          uses:
          - context: fps_combat
            action: Weapon melee / takedown
            input: Hold
          - context: fps_interaction
            action: Focus
            input: Press
        double_press:
          action: Fire mode toggle
          output: B
          uses:
          - context: fps_combat
            action: Fire mode toggle
      gyro:
        action: Precision aim
        output: Gyro To Mouse
        activation: Right Stick Touch
        uses:
        - context: fps_combat
          action: Precision aim
      right_stick_touch:
        double_press:
          action: Flashlight
          output: T
          uses:
          - context: fps_combat
            action: Flashlight
      rt:
        regular:
          action: Fire / Use
          output: Left Mouse
          uses:
          - context: fps_combat
            action: Fire weapon
          - context: fps_combat
            action: Light left melee attack
            input: Tap
          - context: fps_combat
            action: Heavy left melee attack / overarm throw
            input: Hold
          - context: fps_tools
            action: Activate tool primary action
          - context: fps_combat
            action: Block melee attacks
            input: Hold LT + RT
            note: Requires both mouse buttons held together.
      lt:
        regular:
          action: ADS
          output: Right Mouse
          uses:
          - context: fps_combat
            action: Aim down sights
          - context: fps_combat
            action: Light right melee attack
            input: Tap
          - context: fps_combat
            action: Heavy right melee attack / underarm throw
            input: Hold
          - context: fps_tools
            action: Tool secondary action / inject medical pen into another player
          - context: fps_interaction
            action: Orbit inventory camera
            input: Hold
      a:
        regular:
          action: Jump
          output: Space
          uses:
          - context: fps_movement
            action: Jump
            input: Tap
          - context: fps_movement
            action: Climb ledge / activate jump thrusters
            input: Hold
          - context: eva
            action: Strafe up / launch from surface
            input: Hold
      b:
        regular:
          action: Crouch
          output: C
          uses:
          - context: fps_movement
            action: Crouch
        long_press:
          action: Prone
          output: Left Ctrl
          uses:
          - context: fps_movement
            action: Prone
          - context: eva
            action: Strafe down
            input: Hold after Long Press
      x:
        regular:
          action: Reload / Holster
          output: R
          uses:
          - context: fps_combat
            action: Reload
            input: Tap
          - context: fps_combat
            action: Holster weapon
            input: Hold
      y:
        regular:
          action: Interact
          output: F
          uses:
          - context: fps_interaction
            action: Interact
        double_press:
          action: Hold interaction
          output: F (toggle)
          uses:
          - context: fps_interaction
            action: Hold interaction
      lb:
        regular:
          action: Lean left
          output: Q (press/release)
          uses:
          - context: fps_combat
            action: Lean left
          - context: fps_interaction
            action: Toggle looting weapon attachments
            input: Press
      rb:
        regular:
          action: Lean right
          output: E (press/release)
          uses:
          - context: fps_combat
            action: Lean right
      dpad_right:
        regular:
          action: Inventory
          output: I
          uses:
          - context: fps_interaction
            action: Open inventory
            input: Tap
          - context: fps_interaction
            action: Open loot screen
            input: Hold
      left_trackpad:
        action: Unassigned
        output: None
        uses:
        - context: fps_interaction
          action: Unassigned
      right_trackpad:
        up:
          action: Scroll up
          output: Mouse Wheel Up
          uses:
          - context: fps_movement
            action: Increase movement speed
          - context: fps_tools
            action: Increase tractor-beam distance
          - context: camera
            action: Zoom in
          - context: fps_interaction
            action: Zoom in in interaction mode
        down:
          action: Scroll down
          output: Mouse Wheel Down
          uses:
          - context: fps_movement
            action: Decrease movement speed
          - context: fps_tools
            action: Decrease tractor-beam distance
          - context: camera
            action: Zoom out
          - context: fps_interaction
            action: Zoom out in interaction mode
      l5:
        regular:
          action: Key 1
          output: 1
          uses:
          - context: fps_combat
            action: Select primary weapon
            input: Tap
          - context: fps_combat
            action: Open weapon selection radial
            input: Hold
    modifiers:
      l4:
        controls:
          a:
            regular:
              action: Key B
              output: B
              uses:
              - context: fps_combat
                action: Change fire mode
          x:
            regular:
              action: Ammo backpack refill
              output: Left Alt + 1
              uses:
              - context: fps_tools
                action: Ammo backpack refill
          lb:
