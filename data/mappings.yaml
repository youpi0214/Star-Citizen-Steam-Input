  flight:
    name: Flight Mode
    controls:
      l5:
        regular:
          action: Hold L5 Modifier layer
          output: Hold Action Set Layer
          uses:
          - context: shared
            action: Hold L5 Modifier layer
      r5:
        regular:
          action: Cycle mouse mode
          output: Period (.)
