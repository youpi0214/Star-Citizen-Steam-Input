name: Move FPS healing wheel to M1 LB

on:
  push:
    branches:
      - feature/flight-visual-mapping
    paths:
      - .github/workflows/move-fps-healing-wheel.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/flight-visual-mapping
          fetch-depth: 0

      - name: Move FPS healing wheel mapping
        run: |
          python - <<'PY'
          from pathlib import Path

          # YAML: M1+B becomes unassigned; M1+LB becomes Healing / Weapon wheel.
          p = Path('data/mappings.yaml')
          s = p.read_text()
          old = '''          b:\n            regular:\n              action: Healing / Weapon wheel\n              output: TODO\n          x:\n            regular:\n              action: Ammo backpack refill\n              output: Left Alt + 1\n          lb:\n            regular:\n              action: Unassigned\n              output: Empty binding\n'''
          new = '''          b:\n            regular:\n              action: Unassigned\n              output: Empty binding\n          x:\n            regular:\n              action: Ammo backpack refill\n              output: Left Alt + 1\n          lb:\n            regular:\n              action: Healing / Weapon wheel\n              output: TODO\n'''
          if old not in s:
              raise SystemExit('Expected FPS YAML modifier block not found')
          p.write_text(s.replace(old, new, 1))

          # README table.
          p = Path('README.md')
          s = p.read_text()
          old = '''| M1 + B | Regular | Healing / Weapon wheel | TODO |\n| M1 + X | Regular | Ammo backpack refill | `Left Alt + 1` |\n| M1 + LB | Regular | Unassigned | — |\n'''
          new = '''| M1 + B | Regular | Unassigned | — |\n| M1 + X | Regular | Ammo backpack refill | `Left Alt + 1` |\n| M1 + LB | Regular | Healing / Weapon wheel | TODO |\n'''
          if old not in s:
              raise SystemExit('Expected README FPS modifier rows not found')
          p.write_text(s.replace(old, new, 1))

          # FPS SVG labels only; preserve all geometry and data-bind attributes.
          p = Path('templates/steam-controller-2026-fps.svg')
          s = p.read_text()
          old_lb = 'data-bind="modes.fps.modifiers.l4.controls.lb.regular.action">Unassigned</tspan>'
          new_lb = 'data-bind="modes.fps.modifiers.l4.controls.lb.regular.action">Healing / Weapon wheel</tspan>'
          old_b = 'data-bind="modes.fps.modifiers.l4.controls.b.regular.action">Healing / Weapon wheel</tspan>'
          new_b = 'data-bind="modes.fps.modifiers.l4.controls.b.regular.action">Unassigned</tspan>'
          if old_lb not in s or old_b not in s:
              raise SystemExit('Expected FPS SVG labels not found')
          s = s.replace(old_lb, new_lb, 1).replace(old_b, new_b, 1)
          p.write_text(s)
          PY

      - name: Commit mapping move
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mappings.yaml README.md templates/steam-controller-2026-fps.svg
          git commit -m "Move FPS healing wheel to M1+LB"
          git push origin HEAD:feature/flight-visual-mapping
