name: Fix chat VDF structure

on:
  push:
    branches:
      - feature/chat-toggle-validation
    paths:
      - .github/workflows/fix-chat-vdf-structure.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chat-toggle-validation
          fetch-depth: 0

      - name: Fix VDF groups 39 and 41
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mapping/controller_configuration.vdf')
          s = p.read_text()

          def fix_group(text, gid):
              marker = f'\t\t"id"\t\t"{gid}"'
              pos = text.index(marker)
              gs = text.rfind('\t"group"\n\t{', 0, pos)
              ge = text.find('\n\t"group"', pos)
              g = text[gs:ge]
              bad = '\t\t}\n\t\t\t"dpad_west"'
              if bad in g:
                  g = g.replace(bad, '\t\t\t"dpad_west"', 1)
                  settings = '\t\t"settings"\n'
                  si = g.index(settings)
                  g = g[:si] + '\t\t}\n' + g[si:]
              # structural assertions
              inputs_start = g.index('\t\t"inputs"\n\t\t{')
              settings_start = g.index('\t\t"settings"\n')
              west = g.index('\t\t\t"dpad_west"')
              assert inputs_start < west < settings_start
              assert '"binding"\t\t"key_press F12, , "' in g
              return text[:gs] + g + text[ge:]

          s = fix_group(s, '39')
          s = fix_group(s, '41')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapping/controller_configuration.vdf
          git commit -m "Fix M1+D-pad Left VDF structure"
          git push origin HEAD:feature/chat-toggle-validation
