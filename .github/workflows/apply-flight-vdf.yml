name: Apply Flight VDF patch

on:
  push:
    branches:
      - feature/flight-visual-mapping
    paths:
      - scripts/flight-vdf.patch
      - .github/workflows/apply-flight-vdf.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/flight-visual-mapping
          fetch-depth: 0

      - name: Apply Flight mapping patch
        run: git apply --check scripts/flight-vdf.patch && git apply scripts/flight-vdf.patch

      - name: Commit updated VDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapping/controller_configuration.vdf
          git commit -m "Apply Flight Mode Steam Input mappings"
          git push origin HEAD:feature/flight-visual-mapping
